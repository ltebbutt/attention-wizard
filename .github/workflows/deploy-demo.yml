name: Deploy demo (GitHub Pages)

on:
  push:
    branches:
      - claude/adhd-assistant-app-plan-6asao1
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build demo (client-side store, no API needed)
        run: npm run build --workspace apps/web -- --configuration demo

      - name: SPA fallback for Pages
        run: cp apps/web/dist/web/browser/index.html apps/web/dist/web/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
