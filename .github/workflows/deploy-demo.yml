name: Deploy demo (GitHub Pages)

# Publishes the compiled demo to the gh-pages branch. Branch-based Pages needs no
# Pages API permissions (the default token may not create a Pages site, which is
# why the actions/deploy-pages flow failed here).
on:
  push:
    branches:
      - claude/adhd-assistant-app-plan-6asao1
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build demo (client-side store, no API needed)
        run: npm run build --workspace apps/web -- --configuration demo

      - name: SPA fallback + no Jekyll
        run: |
          cp apps/web/dist/web/browser/index.html apps/web/dist/web/browser/404.html
          touch apps/web/dist/web/browser/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist/web/browser
          force_orphan: true
